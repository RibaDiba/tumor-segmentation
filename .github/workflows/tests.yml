name: Run Pytest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      
        # get the code, only the main repo without submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
            submodules: false
            presist-credentials: false

        - name: Configure Hugging Face Auth
            env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
            run: |
            git config --global url."https://user:${HF_TOKEN}@huggingface.co/".insteadOf "https://huggingface.co/"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run the tests
      - name: Run Pytest
        run: pytest