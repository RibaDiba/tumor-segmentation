[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-segmentation"
version = "1.0.0"
description = "Automated instance segmentation of subcutaneous mouse tumors using Detectron2 (Mask R-CNN)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch",
    "torchvision",
    "monai",
    "opencv-python",
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
    "pillow",
    "datasets",
    "huggingface-hub",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ipykernel"]
# detectron2 and segment-anything are install-from-source; see README.

[project.scripts]
tumor-segmentation-train = "pipeline.training_scripts.train:main"

[tool.setuptools.packages.find]
where = ["src", "src/util"]
include = ["pipeline*", "preprocessing*"]
