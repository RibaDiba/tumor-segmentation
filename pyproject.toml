[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-segmentation"
version = "1.0.0"
description = "Automated instance segmentation of subcutaneous mouse tumors using Detectron2 (Mask R-CNN)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    # PyTorch — install separately via the CUDA-specific wheel index; see README.
    # "torch==2.1.2",
    # "torchvision==0.16.2",
    "monai==1.3.0",
    "opencv-python==4.9.0.80",
    "pillow==10.3.0",
    "albumentations==1.4.4",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "matplotlib==3.9.0",
    "tqdm==4.66.4",
    "pyyaml==6.0.1",
    "datasets==2.19.1",
    "huggingface-hub==0.23.1",
    "transformers==4.40.2",
    "pycocotools==2.0.7",
    # segment-anything and detectron2 are install-from-source; see README.
]

[project.optional-dependencies]
dev = ["pytest==8.2.1", "black==24.4.2", "ipykernel==6.29.4"]
tracking = ["wandb==0.17.0"]

[project.scripts]
tumor-segmentation-train = "pipeline.training_scripts.train:main"

[tool.setuptools.packages.find]
where = ["src", "src/util"]
include = ["pipeline*", "preprocessing*"]
