_BASE_: "base.yaml"

# Early-fusion 4-channel RGBD.
# The depth channel is the rendered contourf depth as a single grayscale channel,
# stacked as the 4th input channel on top of BGR by RGBDDatasetMapper.
#
# The 4-entry PIXEL_MEAN is what makes build_model create a (64,4,7,7) conv1.
# First 3 entries keep the caffe BGR convention untouched so the pretrained stem
# stays valid; the 4th entry is the depth mean over the TRAIN split
# (compute_depth_stats.py --variant rgbd_early: mean=151.07 over 3292 images).
#
# Depth STD is intentionally kept at 1.0 (not the measured ~50.2) to match the
# caffe convention the other 3 channels use: the depth .npy is already per-image
# min-max'd to [0,255], so leaving STD=1.0 keeps it at the same ~±100 scale as the
# RGB channels and the inflated conv1 depth filter. Dividing by the real std would
# shrink depth ~50x relative to RGB and swamp it at init.
MODEL:
  PIXEL_MEAN: [103.530, 116.280, 123.675, 151.0660]
  PIXEL_STD: [1.0, 1.0, 1.0, 1.0]
