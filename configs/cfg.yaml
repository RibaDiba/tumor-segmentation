# default config file 

MODEL:
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  ROI_HEADS:
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 512
    POSITIVE_FRACTION: 0.5
    SCORE_THRESH_TEST: 0.3
    NMS_THRESH_TEST: 0.3

DATASETS:
  TRAIN: ["my_dataset_train"]
  TEST: ["my_dataset_test"]

DATALOADER:
  NUM_WORKERS: 1
  FILTER_EMPTY_ANNOTATIONS: False

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.0005
  MAX_ITER: 5000 
  STEPS: [3000, 4000]
  GAMMA: 0.5
  WARMUP_ITERS: 800
  WARMUP_FACTOR: 0.1

OUTPUT_DIR: "./models/rgb-testing/my_custom_model"